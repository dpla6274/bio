<style>
  @font-face { font-family: "Griun"; src: url("assets/griun.woff") format("woff"); font-display: swap; }
  /* full font: only fetched if a character is missing from the subset above */
  @font-face { font-family: "GriunFull"; src: url("assets/griun-full.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Cormorant SBI"; src: url("assets/cormorant-sbi.woff") format("woff"); font-weight: 600; font-style: italic; font-display: swap; }

  :root { --ink: #262428; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #000; }
  body { background: #000; }
  body {
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    font-family: "Griun", "GriunFull", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;

  /* ---------- sheet: clip + paper photo ---------- */
  .sheet {
    position: relative; width: min(86vw, 82svh * 404 / 506, 600px); aspect-ratio: 404 / 506;
    container-type: inline-size; isolation: isolate;
    transform: translateX(-3%);               /* keep sheet + tabs visually centred */
    --u: 0.09389cqw;                          /* 1/1000 of the paper width */
  }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; user-select: none; }
  .paper { z-index: 2; position: absolute; left: 3.30%; top: 22.73%; width: 93.89%; height: 75.1%; isolation: isolate; }

  /* ---------- index tabs ---------- */
  .tabs {
    --tuck: calc(24 * var(--u));              /* part of every tab hidden under the paper */
    position: absolute; left: calc(97.19% - var(--tuck)); top: 22.73%; height: 75.1%;
    display: flex; flex-direction: column; justify-content: center; gap: calc(14 * var(--u));
  }
  .tab {
    --w: calc(96 * var(--u)); --adh: calc(90 * var(--u));
    position: relative; z-index: 0; transition: transform .2s ease;
    display: flex; align-items: center; justify-content: center;
    width: calc(var(--w) + var(--tuck)); padding: calc(20 * var(--u)) 0 calc(20 * var(--u)) var(--tuck);
    background: rgb(var(--c)); border-radius: 0 calc(12 * var(--u)) calc(12 * var(--u)) 0;
  }
  @media (hover: hover) { .tab:hover { transform: translateX(calc(4 * var(--u))); } }
  .tab img { width: calc(46 * var(--u)); height: auto; display: block; pointer-events: none; }
  .tab[data-p="main"]   { --c: 214 210 196; }
  .tab[data-p="ask"]    { --c: 200 203 206; }
  .tab[data-p="prompt"] { --c: 205 210 200; }
  .tab[data-p="pair"]   { --c: 216 206 178; }
  /* the open page shows its tab's adhesive part lying on the paper */
  .tab.current {
    z-index: 3;                               /* stuck on top of the open page */
    width: calc(var(--w) + var(--adh)); margin-left: calc(var(--tuck) - var(--adh)); padding-left: var(--adh);
    background: linear-gradient(90deg, rgb(var(--c) / .6) 0 calc(var(--adh) - 8 * var(--u)), rgb(var(--c)) calc(var(--adh) - 8 * var(--u)));
  }

  /* ---------- pages ---------- */
  .page {
    position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center;
    padding: calc(60 * var(--u)) calc(130 * var(--u)) calc(60 * var(--u)) calc(70 * var(--u));
    mix-blend-mode: multiply;                 /* ink sits in the paper */
  }
  .sheet[data-page="main"] .page.main,
  .sheet[data-page="prompt"] .page.prompt,
  .sheet[data-page="pair"] .page.pair,
  .sheet[data-page="link"] .page.link { display: flex; }

  /* highlighter: real marker-stroke texture behind the text */
  .hl { position: relative; white-space: nowrap; }
  .hl::before {
    content: ""; position: absolute; z-index: -1; left: -.22em; right: -.22em; top: .14em; bottom: -.02em;
    background: url("assets/hl1.png") center / 100% 100% no-repeat;
  }
  .hl.v2::before { background-image: url("assets/hl2.png"); }
  .hl.v3::before { background-image: url("assets/hl3.png"); }

  /* MAIN: printed baggage-tag paper, handwriting sits on its rules */
  @font-face { font-family: "MonoDate"; src: url("assets/mono-date.woff") format("woff"); font-display: swap; }
  .photo-main { display: none; }
  .sheet[data-page="main"] .photo-main { display: block; }
  .sheet[data-page="main"] .photo:not(.photo-main) { visibility: hidden; }
  .sheet[data-page="main"] .photo-prompt { visibility: hidden; }
  .sheet[data-page="main"] .page.main { display: block; }
  .page.main { padding: 0; }
  .main .lines { position: absolute; left: calc(98.42 * var(--u)); top: calc(193.03 * var(--u));
    font-size: calc(29.00 * var(--u)); line-height: calc(42.18 * var(--u)); white-space: nowrap; }
  .main .ln { height: calc(42.18 * var(--u)); }
  .stamp { position: absolute; left: calc(732.86 * var(--u)); top: calc(96.66 * var(--u));
    width: calc(137.08 * var(--u)); height: calc(137.08 * var(--u)); border-radius: 50%; }
  .date { position: absolute; right: calc(87.87 * var(--u)); top: calc(913.88 * var(--u));

    color: rgb(192 52 44); letter-spacing: .02em; opacity: .9; }

  /* PROMPT */

  .copy.p { position: absolute; font-family: "MonoB", monospace; font-weight: 700; font-size: calc(35.15 * var(--u));
    line-height: 1; color: #2c2a30; opacity: .93; }
  .copy {
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0;
    font-size: calc(58 * var(--u)); line-height: 1; position: relative;
  }
  .copy::before {
    content: ""; position: absolute; z-index: -1; left: -.16em; right: -.16em; top: .02em; bottom: -.12em;

  @media (hover: hover) {

  .note { font-size: calc(30 * var(--u)); color: #64625e; }

  /* PAIR */
  .pair { align-items: center; padding-left: calc(40 * var(--u)); padding-right: calc(130 * var(--u)); }
  .postit {

  .postit span {

  }
  .postit .kao { font-size: calc(44 * var(--u)); }
  .postit .pop {
    font-family: "Cormorant SBI", "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600;
    font-size: calc(54 * var(--u)); letter-spacing: -.025em; color: #2d2346;

  }
  .postit.revealed .kao { opacity: 0; } .postit.revealed .pop { opacity: 1; }
  @media (hover: hover) { .postit:hover .kao { opacity: 0; } .postit:hover .pop { opacity: 1; } }

  /* ♥ friends' banners */
  .tab[data-p="link"] { --c: 226 205 205; }
  .tab[data-p="link"] img { width: calc(40 * var(--u)); }
  .page.link { mix-blend-mode: normal; justify-content: flex-start;

    overflow-y: auto; scrollbar-width: none; }
  .page.link::-webkit-scrollbar { display: none; }
  .friends { display: grid; grid-template-columns: 1fr 1fr; gap: calc(16 * var(--u)); align-content: start; margin: auto 0; }
  /* every banner sits in the same frame (200:70); the picture is cropped to fit */
  .friends a { display: block; aspect-ratio: 200 / 70; overflow: hidden; position: relative; text-decoration: none; border-radius: calc(10 * var(--u)); }
  .friends a::after {
    content: attr(data-name); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgb(0 0 0 / .42); color: #fff; font-size: calc(32 * var(--u)); font-weight: 700;
    font-family: "Malgun Gothic", "맑은 고딕", "NanumGothic", "나눔고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    opacity: 0; transition: opacity .2s ease;
  }
  .friends a.on::after { opacity: 1; }
  @media (hover: hover) { .friends a:hover::after { opacity: 1; } }
  .friends.one { grid-template-columns: 1fr; }
  /* tape in the slot the ♥ tab would cover */
  .friends .tape-slot, .friends .spacer { aspect-ratio: 200 / 70; }
  .tape {
    position: absolute; z-index: 5; display: none; align-items: center; justify-content: center;
    background: url("assets/tape.webp") center / 100% 100% no-repeat;
    font-size: calc(38 * var(--u)); color: var(--ink); pointer-events: none; box-sizing: border-box;
  }
  .sheet[data-page="link"] .tape.ready { display: flex; }
  .friends img {
    width: 100%; height: 100%; display: block; object-fit: cover;
    object-position: var(--pos, 50% 50%);              /* which part stays: x% y% */
    transform: scale(var(--zoom, 1)); transform-origin: var(--pos, 50% 50%);
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<script>
/* ---------- prompt texts (copied on click) ---------- */
const P = {
PERSONA: `1 girl,  ::adult, aged up::, mature female, skinny, perfect face, perfect anatomy, long hair, ::straight hair::, 2::blunt bangs::, 2::bangs::, black hair, black eyes, tareme, ::dead eyes::, narrow face, thick eyebrows, straight eyebrows, pale skin, `,

VITTORIO: `1 boy,  ::adult, aged up::, mature male, muscular, handsome, perfect face, perfect anatomy, black hair, hair slicked back, slicked back bangs, purple eyes, thin eyebrows, a scar on mouth, short face, 2::tall::, emotionless, 0.1::tan::,

-2::thick eyebrows, forked eyebrows, prominent chin::,

LORENZO: `1 boy, mature male, aged up, adult, toned, silver hair, hair slicked back, pale skin, blue eyes, narrow eyes, half-closed eyes, short face, handsome, perfect face, perfect anatomy, very tall,

-2::long chin, long-shaped face, narrow face, forked eyebrows::,

MARIA: `1 girl,  ::adult, aged up::, mature female, skinny, perfect face, perfect anatomy, long hair, ::straight hair::, 2::blunt bangs::, 2::bangs::, black hair, black eyes, tareme, ::dead eyes::, narrow face, thick eyebrows, straight eyebrows, pale skin,

loose top, loose pants, mexican fashion, gloves, many accessories, silver accessories, full gloves,`,

-2::long-shaped face, prominent chin::,

buisness suits, white shirt, opened collar, jacket, suit pants, `,

-0.5::prominent chin:::, -3::forked eyebrows::,

black turtleneck knit, black suit pants,`,
KIRILL_UC: `necklace, beard, moles, forked eyebrows, long-shaped face, wrinkles, long chin, heavy jowls, long hair, glasses, prominent chin, pale eyes, sanpaku, smile, simple eyes, sad, wide face, scar, wide eyes, long nose, shiny eyes, wide nose, choker, tan, jewel, freckles, small pupils, hair strands, tear, body hair, blush, 0.2::crew cut::, nipples, ::shaved head::,`,

-0.5::prominent chin:::, -3::forked eyebrows, thick eyebrows::, 2::thin eyebrows::,

baggy suits, business suits, oversized jacket, gold-white square analogue watch on wrist,`,
NARUSE_UC: `necklace, beard, moles, forked eyebrows, long-shaped face, 2::wrinkles::, long chin, heavy jowls, long hair, glasses, prominent chin, pale eyes, sanpaku, simple eyes, sad, wide face, scar, wide eyes, long nose, shiny eyes, wide nose, choker, particles, jewel, freckles, small pupils, hair strands, tear, body hair,  nipples, red skin, red lips, pale skin, brown skin,`,
};
const PAIR_URL = "https://dpla6274.github.io/mRIo/index.html";

/* ---------- page switching by #hash ---------- */
const sheet = document.querySelector(".sheet");
const PAGES = ["main", "prompt", "pair", "link"];
function show() {
  const p = location.hash.slice(1);
  const page = PAGES.includes(p) ? p : "main";
  sheet.dataset.page = page;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("current", t.dataset.p === page));
  postit.classList.remove("revealed");
}
addEventListener("hashchange", show);

/* ---------- copy ---------- */
const status = document.getElementById("status");
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return; } catch (e) {}
  const ta = Object.assign(document.createElement("textarea"), { value: t });
  ta.style.cssText = "position:fixed;opacity:0"; document.body.append(ta); ta.select();
  document.execCommand("copy"); ta.remove();
}
document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", async () => {
  await copyText(P[b.dataset.k]);
  b.classList.add("on"); clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove("on"), 900);
  status.textContent = b.dataset.k.replace("_UC", " UC") + " 복사됨";
}));

/* ---------- pair post-it: desktop = hover swaps + click goes; touch = 1st tap swaps, 2nd goes ---------- */
const postit = document.getElementById("postit");
const touch = matchMedia("(hover: none)").matches;
postit.addEventListener("click", () => {
  if (touch && !postit.classList.contains("revealed")) { postit.classList.add("revealed"); return; }
  window.open(PAIR_URL, "_blank", "noopener");
  postit.classList.remove("revealed");
});
/* ♥: show each banner's alt text on hover */
document.querySelectorAll(".friends a").forEach(a => { const i = a.querySelector("img"); if (i) a.dataset.name = i.alt; });

/* MAIN: today's date printed at the bottom */
(() => { const d = new Date(), p = n => String(n).padStart(2, "0");
  document.getElementById("today").textContent = `№  E ${p(d.getFullYear() % 100)}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; })();

/* ♥: "상시교환" tape goes in the slot the ♥ tab would cover, and is stuck on top of the tab */
const grid = document.querySelector(".friends"), slot = grid.querySelector(".tape-slot");
const tapeEl = document.querySelector(".tape"), linkPage = document.querySelector(".page.link");
function layTape() {
  const r = slot.getBoundingClientRect(), sr = sheet.getBoundingClientRect(), heart = document.querySelector('.tab[data-p="link"]').getBoundingClientRect();
  const left = r.left - sr.left, right = r.right - sr.left;          // same size as the slot, just layered above the ♥ tab
  const h = r.height * .82;
  Object.assign(tapeEl.style, { left: left + "px", width: (right - left) + "px", height: h + "px", top: (r.top - sr.top + (r.height - h) / 2) + "px" });
  tapeEl.classList.add("ready");
}
function placeTape() {
  if (sheet.dataset.page !== "link") return;
  const heart = document.querySelector('.tab[data-p="link"]');
  const banners = [...grid.querySelectorAll("a")];
  let want = -1;
  for (let k = 0; k < 6; k++) {
    const first = grid.firstElementChild.getBoundingClientRect();
    const pitch = first.height + parseFloat(getComputedStyle(grid).rowGap);
    const h = heart.getBoundingClientRect(), mid = h.top + h.height / 2;
    const idx = Math.max(0, Math.floor((mid - first.top) / pitch)) * 2 + 1;   // right-hand column of that row
    if (idx === want) break;
    want = idx;
    const before = banners.slice(0, idx), after = banners.slice(idx), fill = [];
    for (let i = before.length; i < idx; i++) fill.push(Object.assign(document.createElement("span"), { className: "spacer" }));
    grid.replaceChildren(...before, ...fill, slot, ...after);
  }
  layTape();
}
addEventListener("resize", placeTape);
addEventListener("hashchange", () => requestAnimationFrame(placeTape));
linkPage.addEventListener("scroll", layTape);
document.fonts && document.fonts.ready.then(placeTape);

/* touch: tapping anywhere outside the post-it turns it back to the kaomoji */
document.addEventListener("click", e => { if (!postit.contains(e.target)) postit.classList.remove("revealed"); });
show();
requestAnimationFrame(placeTape);
</script>
</body>
</html>
